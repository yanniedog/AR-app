name: pr-auto-resolve-dispositions
# Resolves every review thread whose latest comment is a trusted reply in the
# form "implemented in <sha>", "deferred — <reason>" or "declined — <reason>",
# then re-runs the head's bot-feedback-gate (GitHub emits no event on resolve).
on:
  pull_request_review_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  resolve:
    if: >-
      github.event.comment.in_reply_to_id != null
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve answered threads and re-run the gate
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-auto-resolve-dispositions.mjs
