# Poll Firebase Crashlytics and open GitHub issues for new Crashlytics issue IDs.
# Dedupes via <!-- crashlytics-issue-id: - --> marker in issue bodies.

name: crashlytics-github-issues

on:
  pull_request:
    paths:
      - '.github/workflows/crashlytics-github-issues.yml'
      - 'scripts/crashlytics-to-github-issues.mjs'
      - 'scripts/fixtures/crashlytics-topIssues-mock.json'
      - 'scripts/lib/crashlytics-*.mjs'
      - 'scripts/lib/google-*-oauth-auth.mjs'
  schedule:
    # Every 30 minutes (GitHub Actions cron uses UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log actions without creating GitHub issues
        type: boolean
        default: false
      mock_report:
        description: Path to mock topIssues JSON (skips Firebase API; for testing)
        type: string
        default: ''

concurrency:
  group: crashlytics-github-issues
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Crashlytics sync with fixture
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --test scripts/lib/*.test.mjs
          node scripts/crashlytics-to-github-issues.mjs \
            --dry-run --mock-report scripts/fixtures/crashlytics-topIssues-mock.json

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Crashlytics issues to GitHub
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_USER_OAUTH_JSON: ${{ secrets.FIREBASE_USER_OAUTH_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CRASHLYTICS_LOOKBACK_DAYS: '7'
          CRASHLYTICS_MIN_EVENTS: '1'
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          MOCK_REPORT_INPUT: ${{ inputs.mock_report }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$MOCK_REPORT_INPUT" ]; then
            args+=(--mock-report "$MOCK_REPORT_INPUT")
          elif [ -z "${FIREBASE_USER_OAUTH_JSON:-}" ]; then
            echo "::warning::FIREBASE_USER_OAUTH_JSON not set - live Crashlytics report sync is disabled; running mock dry-run"
            args+=(--dry-run --mock-report scripts/fixtures/crashlytics-topIssues-mock.json)
          fi
          node --test scripts/lib/*.test.mjs
          node scripts/crashlytics-to-github-issues.mjs "${args[@]}"
