name: pr-bot-spreadsheet

# Produce a downloadable matrix (Markdown + HTML + JSON): rows = merged PRs,
# columns = review bots, color-coded by feedback presence, address-before-merge,
# and quota/limit hits. Reports are artifacts instead of protected-main commits.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Max merged PRs to sync
        required: false
        default: '50'
      pr_number:
        description: Optional single PR number
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-bot-spreadsheet
  cancel-in-progress: false
  queue: max

jobs:
  sync-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Generate PR bot matrix artifacts
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIMIT_INPUT: ${{ inputs.limit || '50' }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          ARGS=(--limit "$LIMIT_INPUT")
          if [ -n "$PR_NUMBER_INPUT" ]; then
            ARGS+=(--pr "$PR_NUMBER_INPUT")
          fi
          npm run pr:bot-spreadsheet:sync -- "${ARGS[@]}"
      - name: Publish matrix in workflow summary
        run: cat reports/pr-bot-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR bot matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-bot-matrix-${{ github.run_id }}
          path: reports/pr-bot-matrix.*
          retention-days: 30
          if-no-files-found: error
