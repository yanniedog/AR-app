name: pr-bot-spreadsheet

# Produce a downloadable matrix (Markdown + HTML + JSON): rows = merged PRs,
# columns = review bots, color-coded by feedback presence, address-before-merge,
# and quota/limit hits. Reports are artifacts instead of protected-main commits.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Max merged PRs to sync
        required: false
        default: '50'
      pr_number:
        description: Optional single PR number
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-bot-spreadsheet
  cancel-in-progress: false
  queue: max

jobs:
  sync-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate PR bot matrix artifacts
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(--limit "${{ inputs.limit || '50' }}")
          if [ -n "${{ inputs.pr_number }}" ]; then
            ARGS+=(--pr "${{ inputs.pr_number }}")
          fi
          npm run pr:bot-spreadsheet:sync -- "${ARGS[@]}"
      - name: Publish matrix in workflow summary
        run: cat reports/pr-bot-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR bot matrix
        uses: actions/upload-artifact@v4
        with:
          name: pr-bot-matrix-${{ github.run_id }}
          path: reports/pr-bot-matrix.*
          retention-days: 30
          if-no-files-found: error
