# Submit one exact EAS production build to App Store Connect or Google Play.
# Manual trigger only. Store credentials must be configured in EAS (eas credentials).
#
# Secrets:
#   EXPO_TOKEN - same robot token as mobile-eas-build.yml
#
# Prerequisite: a successful production build for the target platform.

name: mobile-eas-submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to submit
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
      profile:
        description: EAS submit profile (mobile/eas.json - submit)
        required: true
        default: production
        type: choice
        options:
          - production
      build_id:
        description: Exact finished EAS production build UUID to submit
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: mobile-eas-submit
  cancel-in-progress: false

jobs:
  eas-submit:
    name: eas submit (${{ inputs.profile }} - ${{ inputs.platform }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    env:
      EAS_BUILD_ID: ${{ inputs.build_id }}
      EAS_PROFILE: ${{ inputs.profile }}
      EAS_PLATFORM: ${{ inputs.platform }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify protected release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-release-source.mjs

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Add the ar-local-eas robot token under Settings - Secrets - Actions."
            exit 1
          fi

      - name: Validate submission request
        run: |
          if [[ ! "$EAS_BUILD_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::build_id must be an exact EAS build UUID."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tools/eas-cli --ignore-scripts --no-audit --no-fund
          echo "$PWD/tools/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify exact EAS build provenance
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          node scripts/verify-eas-submit-build.mjs \
            --metadata "$RUNNER_TEMP/eas-build.json" \
            --id "$EAS_BUILD_ID" \
            --profile "$EAS_PROFILE" \
            --platform "$EAS_PLATFORM" \
            --source-sha "$GITHUB_SHA"

      - name: EAS Submit (exact build)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --non-interactive \
            --id "$EAS_BUILD_ID" \
            --profile "$EAS_PROFILE" \
            --platform "$EAS_PLATFORM"
