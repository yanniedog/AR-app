# Auto mobile release when the repository's last open PR closes or merges.
# Bumps expo.version through a bot-authored pull request. Protected main never
# needs a workflow-wide bypass.

name: mobile-auto-release-on-queue-drain

on:
  workflow_dispatch:
  # Run trusted main code even when the final closed PR came from a fork.
  # Never check out or execute the closing PR's head in this write-capable job.
  pull_request_target:
    types: [closed]
  # Fallback for builds whose completion emits workflow_run. GITHUB_TOKEN can
  # suppress that event, so the final ARM build explicitly dispatches this
  # workflow after publishing the APK and merging the generated README PR.
  workflow_run:
    workflows: [mobile-android-apk]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch mobile-android-apk after a bump (GITHUB_TOKEN push won't)

concurrency:
  group: mobile-auto-release-on-drain
  cancel-in-progress: false

jobs:
  maybe-release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    # A PR closed without merge (or against another base) can empty the queue.
    # The script checks whether current main still needs a release, including
    # after generated README PRs, instead of skipping events by title.
    name: release app when the PR queue is empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check whether a failed build was superseded
        id: recovery
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$FAILED_BUILD_SHA" ]; then
            # A genuine build failure on unchanged source needs a fix, not an
            # unbounded retry loop. Only recover builds superseded by new main.
            echo "recover=false" >> "$GITHUB_OUTPUT"
            echo "Failed APK source is still main; leaving the failure for investigation."
          else
            echo "recover=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release current main (APK via mobile-android-apk)
        if: steps.recovery.outputs.recover != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
        run: node mobile/scripts/mobile-auto-release-on-drain.mjs
