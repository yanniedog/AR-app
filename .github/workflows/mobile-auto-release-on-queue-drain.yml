# Auto mobile release when the repository's last open PR closes or merges.
# Bumps expo.version through a bot-authored pull request. Protected main never
# needs a workflow-wide bypass.

name: mobile-auto-release-on-queue-drain

on:
  workflow_dispatch:
  # Run trusted main code even when the final closed PR came from a fork.
  # Never check out or execute the closing PR's head in this write-capable job.
  pull_request_target:
    types: [closed]
  # GITHUB_TOKEN-generated QR PR merges do not emit another Actions PR run.
  # APK completion follows that merge and provides a reliable reconciliation.
  workflow_run:
    workflows: [mobile-android-apk]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch mobile-android-apk after a bump (GITHUB_TOKEN push won't)

concurrency:
  group: mobile-auto-release-on-drain
  cancel-in-progress: false

jobs:
  maybe-release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # A PR closed without merge (or against another base) can empty the queue.
    # The script checks whether current main still needs a release, including
    # after generated README PRs, instead of skipping events by title.
    name: release app when the PR queue is empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Release current main (APK via mobile-android-apk)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
        run: node mobile/scripts/mobile-auto-release-on-drain.mjs
