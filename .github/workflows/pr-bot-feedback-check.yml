name: pr-bot-feedback-check

# Thread closure gate. Runs on PR lifecycle AND on review-comment activity so an
# in-thread reply (or a bot posting a finding) re-evaluates the gate automatically
# - no manual re-run / empty re-trigger commit needed. One paginated GraphQL query
# per run; queue:max preserves every required-check result during event bursts.
# Self-heal triggers are limited to events whose check-run attaches to the PR
# HEAD: pull_request (push) and pull_request_review[_comment]. Generated PR
# publishers also dispatch this workflow explicitly with --ref <PR branch>, so
# that workflow_dispatch check is attached to the generated PR head.
# NOTE: GitHub emits no event when a thread is *resolved*, so a resolve-only round
# (no reply, no push) won't auto-re-run a previously-failed gate. After resolving,
# reply inline on a review thread, push, or re-run THIS run on the PR head with
# `gh run rerun <run-id>` (a top-level PR comment will NOT refresh the PR-head check).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Same-head thread events may burst; keep them queued instead of silently
  # cancelling the older pending required check.
  group: bot-feedback-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  bot-feedback-gate:
    if: >-
      github.event.pull_request != null
      || github.event.review != null
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Skip thread gate for bot-authored or exact generated PRs
        id: gate_exempt
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) PR="$INPUT_PR" ;;
            *)                 PR="$EVENT_PR" ;;
          esac
          export PR
          EXEMPT=$(node scripts/pr-gate-exempt-reason.mjs || true)
          if [ -n "$EXEMPT" ]; then
            echo "gate_exempt=true" >> "$GITHUB_OUTPUT"
            echo "gate_exempt_reason=$EXEMPT" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is gate-exempt ($EXEMPT) - thread closure not required"
          else
            echo "gate_exempt=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate exempt - pass (no thread closure)
        if: steps.gate_exempt.outputs.gate_exempt == 'true'
        run: |
          echo "bot-feedback-gate: skipped (${{ steps.gate_exempt.outputs.gate_exempt_reason }} - human bot review not required)"
      - name: Review thread closure gate
        if: steps.gate_exempt.outputs.gate_exempt != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) PR="$INPUT_PR" ;;
            *)                 PR="$EVENT_PR" ;;
          esac
          for attempt in $(seq 1 40); do
            set +e
            npm run pr:bot-feedback-check -- --pr "$PR" --skip-bot-presence
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -eq 2 ]; then
              echo "::warning::GitHub API rate limit - retrying after 60 seconds"
            else
              echo "Review feedback is still open (attempt $attempt/40); keeping the required check pending."
            fi
            sleep 60
          done
          echo "::error::Substantive review feedback remained open for 40 minutes."
          exit 1
