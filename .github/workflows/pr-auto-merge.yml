name: pr-auto-merge

# The reconciler updates behind owner PRs, clears standing native auto-merge
# requests and squash-merges eligible PRs after the review window and required
# gates. Each merge request pins the evaluated head SHA.
#
# A schedule reconciles every open PR (covering missed or failed events) and
# dispatches the APK release when main has unreleased mobile changes, which
# matters when a merge made with the workflow token fires no push workflows.
#
# Security: pull_request_target holds write scope, so only the default branch
# is checked out; PR code is never fetched or run.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, converted_to_draft]
  # Required checks finishing is when a PR becomes mergeable; react at once
  # instead of waiting for the (best-effort, often delayed) schedule.
  workflow_run:
    workflows: [app-ci, pr-bot-feedback-check]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        description: Pull request number (blank for all open pull requests)
      skip_branch_update:
        type: boolean
        description: Leave a behind branch for the author to update
        default: false

permissions:
  contents: read

jobs:
  pull-requests:
    name: Reconcile auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-auto-merge-${{ github.event.pull_request.number || inputs.pr_number || 'all' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile owner PRs
        env:
          GH_TOKEN: ${{ secrets.BOT_GATE_TOKEN || github.token }}
          OWNER_TOKEN_CONFIGURED: ${{ secrets.BOT_GATE_TOKEN != '' }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_AUTO_MERGE_SKIP_BRANCH_UPDATE: ${{ inputs.skip_branch_update }}
        run: |
          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::PR number must be a positive integer"; exit 1; }
            node scripts/pr-auto-merge-reconcile.mjs prs --pr "$PR"
          else
            node scripts/pr-auto-merge-reconcile.mjs prs
          fi

  release-catch-up:
    name: Dispatch APK release for unreleased main
    if: github.event_name != 'pull_request_target' && !inputs.pr_number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-auto-merge-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Release main when it has unreleased mobile changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-auto-merge-reconcile.mjs release
      - name: Start the full audit for the newest untested APK
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-auto-merge-reconcile.mjs explore
