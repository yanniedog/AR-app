# Free unlimited Android preview APK builds on GitHub Actions (no EAS cloud quota).
# Produces a signed release APK for one explicitly selected channel:
#   arm (default): app-apk-arm-latest / app-arm-v{semver}, ARM ABIs only
#   universal:     app-apk-latest / app-v{semver}, all legacy ABIs
# The universal channel remains available as the legacy/x86 fallback.
# Both releases ship app-preview.apk, app-preview-qr.png, and install.html.
#
# Secrets (Settings - Secrets and variables - Actions):
#   GOOGLE_SERVICES_JSON - optional; materialized via ensure-firebase-config.mjs
#   GOOGLE_SERVICE_INFO_PLIST - optional
#   EXPO_PUBLIC_CLARITY_PROJECT_ID - optional Clarity project id
#   EXPO_TOKEN - optional; used to download EAS Android keystore when ANDROID_KEYSTORE_B64 unset
#   ANDROID_KEYSTORE_B64 - optional override; base64 .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD - with B64 override
#
# Signing: prefers ANDROID_KEYSTORE_* secrets; else fetches default keystore from EAS credentials.

name: mobile-android-apk
run-name: mobile-android-apk (${{ inputs.apk_channel || 'arm' }})

# Queue-drain automation dispatches this only after the final patch-version PR
# merges. Building on every preceding main push produced duplicate/stale APKs.
on:
  workflow_dispatch:
    inputs:
      apk_channel:
        description: APK compatibility channel to build and publish
        required: true
        default: arm
        type: choice
        options:
          - arm
          - universal

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  # Shared with mobile-eas-build so two APK publishers cannot select the same
  # next version from the rolling manifest.
  group: mobile-apk-release
  cancel-in-progress: false

jobs:
  android-apk:
    name: android ${{ inputs.apk_channel || 'arm' }} preview apk (GHA)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      APK_CHANNEL: ${{ inputs.apk_channel || 'arm' }}
      EXPO_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_CLARITY_PROJECT_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install APK identity tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --no-audit --no-fund

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          node scripts/ensure-firebase-config.mjs
          node scripts/validate-firebase-package.mjs

      - name: Advance APK version iteration from rolling manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rolling_tag="app-apk-arm-latest"
          if [ "$APK_CHANNEL" = "universal" ]; then
            rolling_tag="app-apk-latest"
          fi
          node scripts/bump-android-version-code.mjs \
            --repo "${{ github.repository }}" \
            --fallback-repo yanniedog/AR-local \
            --rolling-tag "$rolling_tag"

      - name: Materialize Android release keystore
        id: keystore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/materialize-android-keystore.mjs

      - name: Validate JS bundle (typecheck + export)
        run: |
          npm run typecheck
          npm run export:android

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          architecture_args=()
          if [ "$APK_CHANNEL" = "arm" ]; then
            architecture_args+=("-PreactNativeArchitectures=armeabi-v7a,arm64-v8a")
          fi
          ./gradlew assembleRelease --no-daemon "${architecture_args[@]}" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk -name '*-release.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK found under android/app/build/outputs/apk"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Enforce APK size budget
        env:
          AR_APP_APK_PATH: ${{ steps.apk.outputs.path }}
          AR_APP_APK_CHANNEL: ${{ inputs.apk_channel || 'arm' }}
        run: npm run size:report

      - name: Publish preview APK manifest (GitHub release)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          rolling_tag="app-apk-arm-latest"
          if [ "$APK_CHANNEL" = "universal" ]; then
            rolling_tag="app-apk-latest"
          fi
          node scripts/publish-apk-manifest.mjs --apk "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --rolling-tag "$rolling_tag"

      - name: Bridge legacy AR-local APK update channel
        if: github.ref == 'refs/heads/main' && inputs.apk_channel == 'universal'
        env:
          GH_TOKEN: ${{ secrets.AR_LOCAL_RELEASE_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::AR_LOCAL_RELEASE_TOKEN is not set; skipping legacy AR-local APK bridge."
            exit 0
          fi
          node scripts/publish-apk-manifest.mjs --apk "${{ steps.apk.outputs.path }}" \
            --repo yanniedog/AR-local

      - name: Publish README Android install QR section
        if: github.ref == 'refs/heads/main' && inputs.apk_channel == 'universal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-readme-app-install.mjs \
            --repo "${{ github.repository }}" \
            --manifest build/apk-publish/app-apk-latest.json

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ inputs.apk_channel || 'arm' }}-preview-apk
          path: |
            mobile/build/apk-publish/app-preview.apk
            mobile/build/apk-publish/app-apk-latest.json
            mobile/build/apk-publish/app-preview-qr.png
            mobile/build/apk-publish/install.html
          if-no-files-found: error
