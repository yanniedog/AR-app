name: mobile-android-apk
run-name: Android APK release
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
# Serialize all publishers without dropping pending manual build requests.
concurrency:
  group: mobile-apk-release
  cancel-in-progress: false
  queue: max
jobs:
  build:
    name: Build and verify both APKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      artifact_name: signed-apk-pair-${{ github.run_attempt }}
    env:
      NODE_ENV: production
      AR_APP_DISTRIBUTION_CHANNEL: sideload
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify reviewed main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-release-source.mjs --allow-reviewed-ancestor
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;35.0.0"
      - name: Install production build dependencies
        env:
          NODE_ENV: development
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Allocate one version for both APKs
        id: release
        run: |
          node scripts/bump-android-version-code.mjs --repo "$GITHUB_REPOSITORY" --fallback-repo yanniedog/AR-local --rolling-tag app-apk-arm-latest
          node -e "const app=require('./app.json').expo; console.log('version='+app.version); console.log('version_code='+app.android.versionCode)" >> "$GITHUB_OUTPUT"
      - name: Prepare Firebase and signing key
        id: keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/ensure-firebase-config.mjs
          node scripts/validate-firebase-package.mjs
          node scripts/materialize-android-keystore.mjs
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build both APKs with shared native outputs
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: node scripts/android-apk-pair.mjs build
      - name: Save signed APKs and private verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk-pair-${{ github.run_attempt }}
          path: mobile/build/apk-pair
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  publish:
    name: Publish verified APK pair
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mobile-release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      AR_APP_DISTRIBUTION_CHANNEL: sideload
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;35.0.0"
      - run: npm ci --omit=optional --no-audit --no-fund
      - name: Restore this run's verified APK pair
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir build/apk-pair
          node scripts/bump-android-version-code.mjs --release-version "$RELEASE_VERSION" --release-version-code "$RELEASE_CODE"
      - name: Verify delivery and publish both channels
        run: node scripts/android-apk-pair.mjs publish
      - name: Save public release receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-apk-pair-${{ github.run_attempt }}
          path: mobile/build/apk-published
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
