# Free unlimited Android preview APK builds on GitHub Actions (no EAS cloud quota).
# Produces a signed ARM release APK and publishes to:
#   Rolling:   app-apk-arm-latest  (preferred by compatible in-app self-updates)
#   Versioned: app-arm-v{semver}   e.g. app-arm-v1.0.85
# The universal app-apk-latest channel stays frozen as the legacy/x86 fallback.
# Both releases ship app-preview.apk, app-preview-qr.png, and install.html.
#
# Secrets (Settings - Secrets and variables - Actions):
#   GOOGLE_SERVICES_JSON - optional; materialized via ensure-firebase-config.mjs
#   GOOGLE_SERVICE_INFO_PLIST - optional
#   EXPO_TOKEN - optional; used to download EAS Android keystore when ANDROID_KEYSTORE_B64 unset
#   ANDROID_KEYSTORE_B64 - optional override; base64 .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD - with B64 override
#
# Signing: prefers ANDROID_KEYSTORE_* secrets; else fetches default keystore from EAS credentials.

name: mobile-android-apk

# Queue-drain automation dispatches this only after the final patch-version PR
# merges. Building on every preceding main push produced duplicate/stale APKs.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  # Shared with mobile-eas-build so two APK publishers cannot select the same
  # next version from the rolling manifest.
  group: mobile-apk-release
  cancel-in-progress: false

jobs:
  android-apk:
    name: android preview apk (GHA)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install APK identity tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --no-audit --no-fund

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          node scripts/ensure-firebase-config.mjs
          node scripts/validate-firebase-package.mjs

      - name: Advance APK version iteration from rolling manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/bump-android-version-code.mjs
          --repo "${{ github.repository }}"
          --fallback-repo yanniedog/AR-local
          --rolling-tag app-apk-arm-latest

      - name: Materialize Android release keystore
        id: keystore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/materialize-android-keystore.mjs

      - name: Validate JS bundle (typecheck + export)
        run: |
          npm run typecheck
          npm run export:android

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate release APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk -name '*-release.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK found under android/app/build/outputs/apk"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Enforce APK size budget
        env:
          AR_APP_APK_PATH: ${{ steps.apk.outputs.path }}
        run: npm run size:report

      - name: Publish preview APK manifest (GitHub release)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/publish-apk-manifest.mjs --apk "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --rolling-tag app-apk-arm-latest

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-preview-apk
          path: |
            mobile/build/apk-publish/app-preview.apk
            mobile/build/apk-publish/app-apk-latest.json
            mobile/build/apk-publish/app-preview-qr.png
            mobile/build/apk-publish/install.html
          if-no-files-found: error
