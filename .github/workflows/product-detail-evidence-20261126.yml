name: Product detail evidence, 26 November
on:
  push:
    branches: [audit/product-details-20261126]
    paths: [.github/workflows/product-detail-evidence-20261126.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Obtain the published Android release
        run: |
          curl -fLsS https://github.com/yanniedog/AR-app/releases/download/app-v1.0.374/app-preview.apk -o app.apk
          echo '3ba935826c2d1a4b0f3487b063143df8d739ae695ec75d7c2661bad076da42d7  app.apk' | sha256sum -c -
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 320
            adb install -r -g app.apk
            python3 scripts/product-detail-evidence-20261126.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: product-detail-evidence
          path: detail-proof/
          retention-days: 3
