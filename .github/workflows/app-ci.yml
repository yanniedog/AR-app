name: app-ci

# Typecheck + lint + unit tests + bundle export for the mobile app. Daily CDR
# payload generation remains in yanniedog/AR-local.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - '.github/workflows/app-ci.yml'
      - '.github/workflows/mobile-android-apk.yml'
      - '.github/workflows/mobile-eas-build.yml'
      - '.github/workflows/mobile-eas-submit.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - '.github/workflows/app-ci.yml'
      - '.github/workflows/mobile-android-apk.yml'
      - '.github/workflows/mobile-eas-build.yml'
      - '.github/workflows/mobile-eas-submit.yml'

jobs:
  mobile:
    name: mobile-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Mobile CI (doctor - typecheck - lint - test - export)
        run: npm run ci
