name: app-ci

# Typecheck + lint + unit tests + bundle export for the mobile app. Daily CDR
# payload generation remains in yanniedog/AR-local.
on:
  # mobile-ci is required by branch protection, so it must always be created.
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - 'package.json'
      - 'wait_for_bots.mjs'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed for critical additions. The lockfile-pinned, build-only
          # EAS CLI currently carries upstream high/moderate advisories; alerts
          # and Dependabot track those separately until Expo publishes fixes.
          fail-on-severity: critical

  mobile:
    name: mobile-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Review and release automation tests
        working-directory: .
        run: npm run pr:automation:verify
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Mobile CI (doctor - typecheck - lint - test - export)
        run: npm run ci
