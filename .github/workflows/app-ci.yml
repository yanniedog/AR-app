name: app-ci

# Typecheck + lint + unit tests + bundle export for the mobile app. Daily CDR
# payload generation remains in yanniedog/AR-local.
on:
  # mobile-ci is required by branch protection, so it must always be created.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - 'package.json'
      - 'wait_for_bots.mjs'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  mobile:
    name: mobile-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Review and release automation tests
        working-directory: .
        run: npm run pr:automation:verify
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Mobile CI (doctor - typecheck - lint - test - export)
        run: npm run ci
