name: app-ci

# Typecheck + lint + unit tests + bundle export for the mobile app. Daily CDR
# payload generation remains in yanniedog/AR-local.
on:
  # mobile-ci is required by branch protection, so it must always be created.
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - 'package.json'
      - 'wait_for_bots.mjs'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  mobile:
    name: mobile-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review (required mobile-ci gate)
        if: github.event_name == 'pull_request'
        id: dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Review and release automation tests
        working-directory: .
        run: npm run pr:automation:verify
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Compile native APK identity verifier
        run: |
          node scripts/ensure-firebase-config.mjs
          npx expo prebuild --platform android --no-install
          chmod +x android/gradlew
          cd android
          ./gradlew :ar-apk-identity-verifier:compileReleaseKotlin --no-daemon
      - name: Mobile CI (doctor - typecheck - lint - test - export)
        run: npm run ci
