name: app-ci

# Typecheck + lint + unit tests + bundle export for the mobile app. Daily CDR
# payload generation remains in yanniedog/AR-local.
on:
  # mobile-ci is required by branch protection, so it must always be created.
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'firebase/**'
      - 'scripts/**'
      - 'package.json'
      - 'wait_for_bots.mjs'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  mobile:
    name: mobile-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependency review (required mobile-ci gate)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed for high-severity app additions. These exact advisories
          # are confined to the separately pinned, build-only EAS CLI lockfile;
          # keep the exception narrow until Expo ships non-vulnerable releases.
          fail-on-severity: high
          allow-ghsas: >-
            GHSA-3ppc-4f35-3m26,
            GHSA-7r86-cg39-jmmj,
            GHSA-23c5-xmqv-rm74,
            GHSA-28wg-ghj8-5hjv,
            GHSA-2v37-7h3g-55p8,
            GHSA-xwg4-73v4-xw9w,
            GHSA-r292-9mhp-454m
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Review and release automation tests
        working-directory: .
        run: npm run pr:automation:verify
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Compile native APK identity verifier
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :ar-apk-identity-verifier:compileReleaseKotlin --no-daemon
      - name: Mobile CI (doctor - typecheck - lint - test - export)
        run: npm run ci
