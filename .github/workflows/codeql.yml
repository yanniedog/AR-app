name: CodeQL

# Advanced setup replaces GitHub's default setup: Expo generates the Android
# build during prebuild, so Java/Kotlin cannot use CodeQL's autobuild mode.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'java-kotlin'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: matrix.language == 'java-kotlin'
        with:
          packages: platform-tools
      - name: Generate Android build
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node scripts/ensure-firebase-config.mjs
          npx expo prebuild --platform android --no-install
          chmod +x android/gradlew
      - name: Prepare Android settings dependencies
        if: matrix.language == 'java-kotlin'
        working-directory: mobile/android
        timeout-minutes: 10
        # Resolve settings plugins before tracing; help does not compile app modules.
        run: |
          set -o pipefail
          timeout 8m ./gradlew help --no-daemon --no-build-cache --info --stacktrace 2>&1 | tee "$RUNNER_TEMP/codeql-gradle-prepare.log"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile native modules for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile/android
        # Force compilation under the tracer, even if Gradle has cached outputs.
        run: |
          set -o pipefail
          ./gradlew \
            :ar-apk-identity-verifier:compileReleaseKotlin \
            :ar-history-codec:compileReleaseKotlin \
            :ar-history-codec:compileReleaseJavaWithJavac \
            :ar-audit-screen-awake:compileReleaseKotlin \
            :expo-task-manager:compileReleaseJavaWithJavac \
            :expo-background-task:compileReleaseKotlin \
            --no-daemon --no-build-cache --rerun-tasks --info --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/codeql-gradle-compile.log"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
      - name: Retain native build diagnostics
        if: always() && matrix.language == 'java-kotlin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-native-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-gradle-prepare.log
            ${{ runner.temp }}/codeql-gradle-compile.log
          retention-days: 7
