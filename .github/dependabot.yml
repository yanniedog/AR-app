version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Hobart
    open-pull-requests-limit: 5
    groups:
      safe-npm-updates:
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Australia/Hobart
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /mobile/tools/eas-cli
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Australia/Hobart
    open-pull-requests-limit: 2
